<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Akinator-LLM</title>

  <!-- Deux polices : un serif pour les titres et la question, un sans-serif
       pour l'interface. Flask sert le dossier static/ tout seul. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Inter:wght@400;500&display=swap">
  <link rel="stylesheet" href="/static/style.css">

  <!-- defer : le script s'exécute une fois la page construite. -->
  <script src="/static/jeu.js" defer></script>
</head>
<body>
<main>

  <header>
    <h1>Akinator-LLM</h1>
    <p>Pense à quelque chose, puis réponds aux questions.</p>
  </header>

  <!-- Carte centrale : l'étiquette du tour et le texte du modèle. -->
  <section class="carte">
    <p id="etiquette"></p>
    <p id="scene">…</p>
  </section>

  <!-- Boutons de réponse à une question : ils sont toujours les mêmes. -->
  <div id="reponses" class="groupe" hidden>
    <button onclick="repondre('Oui')">Oui</button>
    <button onclick="repondre('Non')">Non</button>
    <button onclick="repondre('Souvent')">Souvent</button>
    <button onclick="repondre('Parfois')">Parfois</button>
    <button onclick="repondre('Je ne sais pas')">Je ne sais pas</button>
  </div>

  <!-- Boutons affichés quand le modèle propose une devinette. -->
  <div id="devinette" class="groupe" hidden>
    <button class="principal" onclick="gagne()">Oui, gagné</button>
    <button onclick="refuser()">Non, continue</button>
  </div>

  <!-- Bouton affiché pendant toute la partie : permet de déclarer forfait pour
       le modèle et d'enregistrer la partie comme perdue. -->
  <div id="abandon" class="groupe" hidden>
    <button class="discret" onclick="abandonner()">J'abandonne, il ne trouvera pas</button>
  </div>

  <!-- Bouton de départ (et de relance après une partie). -->
  <div id="depart" class="groupe">
    <button class="principal" onclick="nouvellePartie()">Commencer</button>
  </div>

  <!-- Réponse brute du serveur, pour suivre le déroulé du jeu. Le bloc reste
       masqué tant que le journal est vide (voir style.css). -->
  <section id="technique">
    <p class="titre">Réponse du serveur</p>
    <pre id="journal"></pre>
  </section>

  <!-- Historique des parties précédentes, rempli depuis la base de données. -->
  <section class="historique">
    <h2>Historique des devinettes</h2>
    <ul id="historique"></ul>
    <div class="groupe">
      <button class="discret" onclick="effacerHistorique()">Effacer l'historique</button>
    </div>
  </section>

</main>
</body>
</html>
